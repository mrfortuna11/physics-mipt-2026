<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Rigid Body Dynamics</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #1a1a1a; color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #app { display: flex; flex-direction: column; height: 100vh; }

  /* вкладки верхнего уровня */
  #tabs {
    display: flex; background: #222; border-bottom: 1px solid #333;
    padding: 0 12px; flex-shrink: 0;
  }
  .tab {
    padding: 10px 18px; cursor: pointer; color: #888;
    border-bottom: 2px solid transparent; user-select: none;
    font-size: 14px;
  }
  .tab.active { color: #fff; border-bottom-color: #4a9eff; }
  .tab:hover { color: #ccc; }
  .tab.disabled { color: #555; cursor: not-allowed; }
  .tab.disabled:hover { color: #555; }

  /* под-вкладки внутри части */
  #subtabs {
    display: flex; background: #1f1f1f; border-bottom: 1px solid #2c2c2c;
    padding: 0 16px; flex-shrink: 0; font-size: 12px;
  }
  .subtab {
    padding: 6px 14px; cursor: pointer; color: #888;
    border-bottom: 2px solid transparent; user-select: none;
  }
  .subtab.active { color: #fff; border-bottom-color: #a78bfa; }
  .subtab:hover { color: #ccc; }

  /* панель контролов */
  #controls {
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    padding: 8px 16px; background: #252525; border-bottom: 1px solid #333;
    flex-shrink: 0; font-size: 13px;
  }
  #controls label { color: #aaa; display: flex; gap: 6px; align-items: center; }
  #controls button {
    background: #333; color: #eee; border: 1px solid #444;
    padding: 5px 12px; border-radius: 3px; cursor: pointer; font-size: 13px;
  }
  #controls button:hover { background: #3d3d3d; }
  #controls input[type="range"] { width: 100px; }
  #controls .value { color: #ddd; min-width: 38px; font-variant-numeric: tabular-nums; }
  .ctrl-group { display: flex; gap: 12px; align-items: center; }
  .ctrl-group.hidden { display: none; }

  /* рендер */
  #scene-host { flex: 1; position: relative; overflow: hidden; }
  #canvas { display: block; width: 100%; height: 100%; }

  #overlays { position: absolute; inset: 0; pointer-events: none; }
  .vp-label {
    position: absolute; padding: 6px 10px;
    background: rgba(20,20,20,0.78); border: 1px solid #333;
    border-radius: 3px; font-size: 11px; line-height: 1.5;
    font-variant-numeric: tabular-nums;
    color: #ddd; max-width: 320px;
  }
  .vp-label .title { color: #4a9eff; font-weight: 500; margin-bottom: 3px; }
  .vp-label .note { color: #999; font-size: 10px; font-style: italic; }

  .legend {
    position: absolute; bottom: 10px; right: 10px;
    background: rgba(20,20,20,0.85); border: 1px solid #333;
    padding: 8px 10px; border-radius: 3px; font-size: 11px;
    color: #ccc; line-height: 1.6;
  }
  .legend .sw { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 5px; }
  .legend.hidden { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="tabs">
    <div class="tab active" data-tab="1">Часть 1 · Свободное вращение</div>
    <div class="tab" data-tab="2">Часть 2 · Constraints</div>
    <div class="tab" data-tab="3">Часть 3 · Коллизии</div>
    <div class="tab" data-tab="4">Часть 4 · Broadphase</div>
  </div>

  <div id="subtabs"></div>

  <div id="controls">
    <button id="btn-pause">⏸ Пауза</button>
    <button id="btn-reset">↻ Reset</button>
    <button id="btn-step">▶| Шаг</button>
    <label>dt: <input id="sl-dt" type="range" min="0.0005" max="0.02" step="0.0005" value="0.002"><span class="value" id="v-dt">0.0020</span></label>
    <label>substeps: <input id="sl-sub" type="range" min="1" max="20" step="1" value="4"><span class="value" id="v-sub">4</span></label>

    <div class="ctrl-group" id="ctrl-part1">
      <label>ω<sub>perturb</sub>: <input id="sl-pert" type="range" min="0" max="0.5" step="0.005" value="0.15"><span class="value" id="v-pert">0.150</span></label>
    </div>

    <div class="ctrl-group hidden" id="ctrl-part2-spring">
      <label>gravity: <input id="sl-g" type="range" min="0" max="20" step="0.5" value="9.81"><span class="value" id="v-g">9.81</span></label>
      <label>k (force): <input id="sl-k" type="range" min="10" max="500" step="10" value="50"><span class="value" id="v-k">50</span></label>
      <label>c (damp): <input id="sl-c" type="range" min="0" max="5" step="0.1" value="1.0"><span class="value" id="v-c">1.0</span></label>
      <label>Hz (soft): <input id="sl-hz" type="range" min="0.5" max="20" step="0.5" value="3"><span class="value" id="v-hz">3.0</span></label>
      <label>ζ (soft): <input id="sl-zeta" type="range" min="0" max="2" step="0.05" value="0.7"><span class="value" id="v-zeta">0.70</span></label>
    </div>

    <div class="ctrl-group hidden" id="ctrl-part2-dist">
      <label>gravity: <input id="sl-g2" type="range" min="0" max="20" step="0.5" value="9.81"><span class="value" id="v-g2">9.81</span></label>
      <label>α (XPBD): <input id="sl-alpha" type="range" min="0" max="0.01" step="0.0001" value="0"><span class="value" id="v-alpha">0.0000</span></label>
      <label>β (Baumgarte): <input id="sl-beta" type="range" min="0" max="1" step="0.02" value="0.2"><span class="value" id="v-beta">0.20</span></label>
      <label>Hz (soft): <input id="sl-hz2" type="range" min="1" max="30" step="0.5" value="10"><span class="value" id="v-hz2">10.0</span></label>
      <label>ζ (soft): <input id="sl-zeta2" type="range" min="0" max="2" step="0.05" value="0.7"><span class="value" id="v-zeta2">0.70</span></label>
      <label>vel iters: <input id="sl-vi" type="range" min="1" max="20" step="1" value="4"><span class="value" id="v-vi">4</span></label>
      <label>pos iters: <input id="sl-pi" type="range" min="0" max="10" step="1" value="2"><span class="value" id="v-pi">2</span></label>
      <label>lin damp: <input id="sl-ld" type="range" min="0" max="5" step="0.1" value="0.5"><span class="value" id="v-ld">0.5</span></label>
      <label>ang damp: <input id="sl-ad" type="range" min="0" max="5" step="0.1" value="0.5"><span class="value" id="v-ad">0.5</span></label>
    </div>

    <div class="ctrl-group hidden" id="ctrl-part3">
      <label>restitution: <input id="sl-rest" type="range" min="0" max="1" step="0.05" value="0.2"><span class="value" id="v-rest">0.20</span></label>
      <label>α (XPBD): <input id="sl-c3a" type="range" min="0" max="0.01" step="0.0001" value="0"><span class="value" id="v-c3a">0.0000</span></label>
      <label>β (Baum): <input id="sl-c3b" type="range" min="0" max="0.5" step="0.01" value="0.1"><span class="value" id="v-c3b">0.10</span></label>
      <label>pos iters: <input id="sl-c3pi" type="range" min="1" max="10" step="1" value="2"><span class="value" id="v-c3pi">2</span></label>
      <label>vel iters: <input id="sl-c3vi" type="range" min="1" max="10" step="1" value="4"><span class="value" id="v-c3vi">4</span></label>
      <label>μ_s: <input id="sl-c3mus" type="range" min="0" max="2" step="0.05" value="0.5"><span class="value" id="v-c3mus">0.50</span></label>
      <label>μ_d: <input id="sl-c3mud" type="range" min="0" max="2" step="0.05" value="0.3"><span class="value" id="v-c3mud">0.30</span></label>
      <label>N (pile): <input id="sl-c3n" type="range" min="50" max="1500" step="50" value="400"><span class="value" id="v-c3n">400</span></label>
    </div>

    <div class="ctrl-group hidden" id="ctrl-part4">
      <label>restitution: <input id="sl-c4rest" type="range" min="0" max="1" step="0.05" value="0.1"><span class="value" id="v-c4rest">0.10</span></label>
      <label>μ_s: <input id="sl-c4mus" type="range" min="0" max="2" step="0.05" value="0.6"><span class="value" id="v-c4mus">0.60</span></label>
      <label>μ_d: <input id="sl-c4mud" type="range" min="0" max="2" step="0.05" value="0.4"><span class="value" id="v-c4mud">0.40</span></label>
      <label>N (varied): <input id="sl-c4n" type="range" min="50" max="800" step="25" value="250"><span class="value" id="v-c4n">250</span></label>
      <label>ramp °: <input id="sl-c4ramp" type="range" min="0" max="60" step="1" value="25"><span class="value" id="v-c4ramp">25</span></label>
    </div>
  </div>

  <div id="scene-host">
    <canvas id="canvas"></canvas>
    <div id="overlays"></div>

    <div class="legend" id="legend-part1">
      <div><span class="sw" style="background:#4ade80"></span>L₀ — начальный момент импульса</div>
      <div><span class="sw" style="background:#f87171"></span>L(t) — текущий момент импульса</div>
      <div><span class="sw" style="background:#fbbf24"></span>ω — угловая скорость</div>
    </div>

    <div class="legend hidden" id="legend-part2">
      <div><span class="sw" style="background:#a78bfa"></span>пружинка / constraint</div>
      <div><span class="sw" style="background:#4ade80; width: 8px; height: 8px; border-radius: 50%;"></span>якорь</div>
      <div><span class="sw" style="background:#fbbf24; width: 8px; height: 8px; border-radius: 50%;"></span>точка крепления</div>
    </div>

    <div class="legend hidden" id="legend-part34">
      <div>R — пересоздать сцену (Reset)</div>
      <div>XPBD friction = μ_s·d (static) / μ_d·d (dynamic)</div>
    </div>
  </div>
</div>

<!-- Three.js as global UMD (works via file:// without a local server). -->
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>

<!-- Project modules (plain <script>, share globals — no ES-module imports). -->
<script src="lib/state.js"></script>
<script src="lib/math.js"></script>
<script src="lib/body.js"></script>
<script src="lib/free_rotation.js"></script>
<script src="lib/dynamics.js"></script>
<script src="lib/sat.js"></script>
<script src="lib/broadphase.js"></script>
<script src="lib/xpbd.js"></script>
<script src="views/part1.js"></script>
<script src="views/part2.js"></script>
<script src="views/part3.js"></script>
<script src="main.js"></script>
</body>
</html>
